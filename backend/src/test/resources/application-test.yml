spring:
  datasource:
    url: jdbc:h2:mem:elderlycare;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  sql:
    init:
      mode: always
      schema-locations: classpath:test-schema.sql
      data-locations: classpath:test-data.sql

mybatis-plus:
  global-config:
    banner: false
  configuration:
    map-underscore-to-camel-case: true

elderly:
  jwt:
    secret: test-secret-test-secret-test-secret-123456
    expire-seconds: 7200
