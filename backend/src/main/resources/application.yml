server:
  port: 8080

spring:
  application:
    name: neusoft-elderly-care-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:neusoft_elderly_care}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  global-config:
    banner: false
  configuration:
    map-underscore-to-camel-case: true

elderly:
  jwt:
    secret: ${JWT_SECRET:elderly-care-secret-please-change-1234567890}
    expire-seconds: ${JWT_EXPIRE_SECONDS:7200}
